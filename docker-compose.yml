services:
  db:
    image: postgres:16-alpine
    container_name: meister-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meister}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-meister}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meister} -d ${POSTGRES_DB:-meister}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: runtime
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meister}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-meister}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    command: node dist/main-api.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      DATABASE_URL: postgresql://${POSTGRES_USER:-meister}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-meister}?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-8h}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
      LOCK_TIME_MINUTES: ${LOCK_TIME_MINUTES:-15}
      LOGIN_MAX_ATTEMPTS_PAIR: ${LOGIN_MAX_ATTEMPTS_PAIR:-3}
      LOGIN_MAX_ATTEMPTS_ACCOUNT: ${LOGIN_MAX_ATTEMPTS_ACCOUNT:-10}
      LOGIN_MAX_ATTEMPTS_IP: ${LOGIN_MAX_ATTEMPTS_IP:-30}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      MEI_ANNUAL_LIMIT: ${MEI_ANNUAL_LIMIT:-81000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-meister_financas_bot}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      NARRATION_MODE: ${NARRATION_MODE:-auto}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_WEBHOOK_SECRET: ${PLUGGY_WEBHOOK_SECRET:-}
      PLUGGY_BASE_URL: ${PLUGGY_BASE_URL:-}
      INTERNAL_TICK_SECRET: ${INTERNAL_TICK_SECRET:?defina INTERNAL_TICK_SECRET}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: meister-mailpit
    profiles: ["dev"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
