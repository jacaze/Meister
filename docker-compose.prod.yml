services:
  api:
    environment:
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      APP_URL: https://${DOMAIN:-localhost}
      CORS_ORIGINS: https://${DOMAIN:-localhost}
      # Atualmente validado em backend/src/shared/env.ts (exige TELEGRAM_WEBHOOK_SECRET quando TELEGRAM_BOT_TOKEN está definido).
      # A alternância efetiva entre polling e webhook em runtime ainda é pendência do backend.
      TELEGRAM_MODE: webhook
      DEMO_MODE: "false"

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_PLUGGY_INCLUDE_SANDBOX: ${VITE_PLUGGY_INCLUDE_SANDBOX:-false}
        VITE_FEATURE_FAMILIA: ${VITE_FEATURE_FAMILIA:-false}
    expose:
      - "8080"
    restart: unless-stopped

  proxy:
    image: caddy:2.11-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  cron:
    build:
      context: ./docker/cron
    environment:
      TZ: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      INTERNAL_TICK_SECRET: ${INTERNAL_TICK_SECRET:?defina INTERNAL_TICK_SECRET}
      API_TICK_URL: http://api:3000/api/internal/tick # gitleaks:allow
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
