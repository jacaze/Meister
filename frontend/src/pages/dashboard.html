<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meister - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-slate-100 min-h-screen">
    
    <script>
        const token = localStorage.getItem('token');
        const userName = localStorage.getItem('userName');

        if (!token) {
            window.location.href = 'index.html';
        }
    </script>

    <div class="p-8">
        <h1 class="text-2xl font-bold text-amber-400">Bem-vindo ao Dashboard, <span id="welcomeName"></span>!</h1>
        <p class="text-zinc-400 mt-2">Aqui ficará o controle financeiro do seu MEI.</p>
        
        <button onclick="logout()" class="mt-6 px-4 py-2 bg-rose-600 text-white rounded-xl">
            Sair da Conta
        </button>
    </div>

    <script>
        document.getElementById('welcomeName').textContent = userName;

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userName');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
