name: CI Gate 0

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-and-db:
    name: Backend (Typecheck, Lint, Tests, Integration DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meister
          POSTGRES_PASSWORD: meister_ci_password
          POSTGRES_DB: meister_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meister -d meister_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://meister:meister_ci_password@localhost:5432/meister_test?schema=public
      DIRECT_URL: postgresql://meister:meister_ci_password@localhost:5432/meister_test?schema=public
      SHADOW_DATABASE_URL: postgresql://meister:meister_ci_password@localhost:5432/meister_shadow?schema=public
      JWT_SECRET: ci_test_only_secret_key_with_at_least_32_characters_long
      INTERNAL_TICK_SECRET: ci_test_only_internal_tick_secret_32_chars

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client & Apply Migrations
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          PGPASSWORD=meister_ci_password psql -h localhost -U meister -d meister_test -c "CREATE DATABASE meister_shadow;" || true
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Unit & Property Tests
        working-directory: backend
        run: npm test

      - name: Integration Tests (PostgreSQL 16)
        working-directory: backend
        run: npm run test:integration

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Security Audit (Backend)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (Lint, Typecheck, Tests, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
